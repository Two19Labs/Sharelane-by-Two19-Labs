name: github packages

# npm (npmjs.com/package/sharelane) is the main install. This mirrors each
# GitHub release to GitHub Packages, which requires an owner-scoped name.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@two19labs"
      - run: npm ci
      - run: npm pkg set name=@two19labs/sharelane
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
