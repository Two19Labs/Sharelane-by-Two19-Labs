version: 1

agents:
  claude:
    displayName: Claude Code
    command: claude
    run:
      args:
        - -p
        - "{prompt}"
        - --output-format
        - json
        - --permission-mode
        - acceptEdits
        - --mcp-config
        - .mcp.json
        - --strict-mcp-config
        - --allowedTools
        - mcp__sharelane__context_map,mcp__sharelane__read_chunk,mcp__sharelane__update_chunk,mcp__sharelane__search,mcp__sharelane__log_progress,mcp__sharelane__delegate,mcp__sharelane__status,mcp__sharelane__wait,mcp__sharelane__reply,mcp__sharelane__cancel
    resume:
      args:
        - -p
        - "{prompt}"
        - --resume
        - "{session}"
        - --output-format
        - json
        - --permission-mode
        - acceptEdits
        - --mcp-config
        - .mcp.json
        - --strict-mcp-config
        - --allowedTools
        - mcp__sharelane__context_map,mcp__sharelane__read_chunk,mcp__sharelane__update_chunk,mcp__sharelane__search,mcp__sharelane__log_progress,mcp__sharelane__delegate,mcp__sharelane__status,mcp__sharelane__wait,mcp__sharelane__reply,mcp__sharelane__cancel
    output: claude-json
    instructionsFile: CLAUDE.md

  codex:
    displayName: Codex
    command: codex
    run:
      args:
        - exec
        - --json
        - --sandbox
        - workspace-write
        - --skip-git-repo-check
        - "{prompt}"
    resume:
      args:
        - exec
        - resume
        - --json
        - "{session}"
        - "{prompt}"
    output: codex-jsonl
    instructionsFile: AGENTS.md
