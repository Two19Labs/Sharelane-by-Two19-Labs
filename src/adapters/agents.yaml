version: 1

agents:
  claude:
    displayName: Claude Code
    command: claude
    run:
      args:
        - -p
        - "{prompt}"
        - --output-format
        - json
        - "{scopeArgs}"
        - --mcp-config
        - .mcp.json
        - --strict-mcp-config
        - --allowedTools
        - mcp__sharelane__context_map,mcp__sharelane__read_chunk,mcp__sharelane__update_chunk,mcp__sharelane__search,mcp__sharelane__claim,mcp__sharelane__heartbeat,mcp__sharelane__release,mcp__sharelane__log_progress,mcp__sharelane__delegate,mcp__sharelane__status,mcp__sharelane__wait,mcp__sharelane__reply,mcp__sharelane__cancel
    resume:
      args:
        - -p
        - "{prompt}"
        - --resume
        - "{session}"
        - --output-format
        - json
        - "{scopeArgs}"
        - --mcp-config
        - .mcp.json
        - --strict-mcp-config
        - --allowedTools
        - mcp__sharelane__context_map,mcp__sharelane__read_chunk,mcp__sharelane__update_chunk,mcp__sharelane__search,mcp__sharelane__claim,mcp__sharelane__heartbeat,mcp__sharelane__release,mcp__sharelane__log_progress,mcp__sharelane__delegate,mcp__sharelane__status,mcp__sharelane__wait,mcp__sharelane__reply,mcp__sharelane__cancel
    # Scoped tasks switch to dontAsk: tools not pre-approved are denied, and
    # built-in file edits are pre-approved only inside the delegated scope.
    scope:
      unscoped:
        - --permission-mode
        - acceptEdits
      scoped:
        - --permission-mode
        - dontAsk
        - --allowedTools
        - "Edit({scopePattern})"
        - "Write({scopePattern})"
    output: claude-json
    instructionsFile: CLAUDE.md

  codex:
    displayName: Codex
    command: codex
    run:
      args:
        - exec
        - --json
        - --sandbox
        - workspace-write
        - --skip-git-repo-check
        - "{scopeArgs}"
        - -c
        - 'mcp_servers.sharelane.env_vars=["SHARELANE_TASK_ID","SHARELANE_PROJECT_ROOT","SHARELANE_WORKSPACE_ROOT","SHARELANE_PARENT","SHARELANE_DEPTH"]'
        - "{prompt}"
    resume:
      args:
        - exec
        - "{scopeArgs}"
        - resume
        - -c
        - 'mcp_servers.sharelane.env_vars=["SHARELANE_TASK_ID","SHARELANE_PROJECT_ROOT","SHARELANE_WORKSPACE_ROOT","SHARELANE_PARENT","SHARELANE_DEPTH"]'
        - --json
        - "{session}"
        - "{prompt}"
    # Codex's workspace-write sandbox is folder-based: scoped tasks root the
    # sandbox at the scope folder; finer file globs rely on Git detection.
    # ShareLane worktrees live under the temp folder, which Codex normally
    # keeps writable, so scoped runs remove the temp-folder allowances.
    scope:
      scoped:
        - --cd
        - "{scopeRoot}"
        - "--add-dir={scopeExtraDir}"
        - -c
        - sandbox_workspace_write.exclude_tmpdir_env_var=true
        - -c
        - sandbox_workspace_write.exclude_slash_tmp=true
    output: codex-jsonl
    instructionsFile: AGENTS.md

  antigravity:
    displayName: Antigravity CLI
    command: agy
    # accept-edits approves only file edits in print mode; terminal commands
    # are refused. ShareLane MCP tools need one global allow rule:
    # permissions.allow "mcp(sharelane/*)" in ~/.gemini/antigravity-cli/settings.json.
    run:
      args:
        - -p
        - "{prompt}"
        - --output-format
        - json
        - --mode
        - accept-edits
    resume:
      args:
        - -p
        - "{prompt}"
        - --conversation
        - "{session}"
        - --output-format
        - json
        - --mode
        - accept-edits
    # No native per-path restriction: scope is enforced by claims, the
    # PreToolUse edit guard in .agents/hooks.json, and Git.
    output: antigravity-json
    instructionsFile: AGENTS.md
